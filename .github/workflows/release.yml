name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci
      - name: Audit frontend dependencies
        run: npm --prefix web audit --audit-level=low

      - name: Run backend race tests
        run: go test -race -count=1 ./...

      - name: Check known Go vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: 1.26.5
          go-package: ./...
          repo-checkout: false

      - name: Build reproducible release package
        env:
          VERSION: ${{ github.ref_name }}
        run: bash deploy/package-release.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: traffic-go-${{ github.ref_name }}-linux-amd64
          path: |
            release/${{ github.ref_name }}/traffic-go-${{ github.ref_name }}-linux-amd64.tar.gz
            release/${{ github.ref_name }}/traffic-go-${{ github.ref_name }}-linux-amd64.tar.gz.sha256
          if-no-files-found: error
